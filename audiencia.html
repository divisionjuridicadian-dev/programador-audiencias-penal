<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiencia · Programador · Unidad Penal DIAN</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brandblock">
      <div class="tab-mark"></div>
      <div class="brand-escudo-wrap"><img src="assets/escudo_colombia.png" alt="DIAN"></div>
      <div>
        <h1>Programador de Audiencias</h1>
        <div class="subtitle">Unidad Penal · DIAN</div>
      </div>
    </div>
    <nav class="top-nav">
      <a href="index.html">Audiencias</a>
      <a href="audiencia.html" class="active">+ Nueva audiencia</a>
      <a href="carga-masiva.html">Carga masiva</a>
      <a href="catalogos.html">Catálogos</a>
      <span class="user-chip" id="userChip" style="display:none;">
        <span id="userEmail"></span>
        <button class="btn-logout" id="btnLogout">Salir</button>
      </span>
    </nav>
  </div>
</header>

<main class="page narrow">
  <div class="card">
    <div class="card-head">
      <div>
        <h2 id="formTitle">Nueva audiencia</h2>
        <p id="formSub">Todos los campos con radicado son obligatorios.</p>
      </div>
      <button class="btn-danger" id="btnEliminar" type="button" style="display:none;"></button>
    </div>
    <div class="card-body">
      <form id="audienciaForm">
        <div class="form-section">
          <h3 class="form-section-title">Datos del proceso</h3>
          <div class="field-grid">
            <div class="field span-2">
              <label for="radicado">Radicado del proceso</label>
              <input type="text" id="radicado" class="mono" inputmode="numeric" placeholder="23 dígitos, solo números" required>
              <span class="hint" id="radicadoHint">23 dígitos, solo números.</span>
            </div>
            <div class="field span-2">
              <label for="despacho">Despacho</label>
              <input type="text" id="despacho" placeholder="Ej. J 2 P CTO MED.">
            </div>
            <div class="field">
              <label for="tipoAudiencia">Tipo de audiencia</label>
              <select id="tipoAudiencia"></select>
            </div>
            <div class="field">
              <label for="resultado">Resultado</label>
              <select id="resultado"></select>
            </div>
            <div class="field">
              <label for="cuantia">Cuantía</label>
              <input type="number" id="cuantia" step="1" min="0">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title">Programación</h3>
          <div class="field-grid">
            <div class="field">
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" required>
            </div>
            <div class="field">
              <label for="hora">Hora inicio</label>
              <input type="time" id="hora">
            </div>
            <div class="field">
              <label for="horaFin">Hora fin</label>
              <input type="time" id="horaFin">
            </div>
            <div class="field">
              <label for="modalidad">Modalidad</label>
              <select id="modalidad">
                <option value="Virtual">Virtual</option>
                <option value="Presencial">Presencial</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="linkAudiencia">Enlace de la audiencia</label>
              <input type="text" id="linkAudiencia" placeholder="https://…">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title">Participantes</h3>
          <div class="field-grid">
            <div class="field">
              <label for="abogadoTitular">Abogado titular</label>
              <select id="abogadoTitular"></select>
            </div>
            <div class="field">
              <label for="abogadoReemplaza">Abogado que reemplaza</label>
              <select id="abogadoReemplaza"></select>
            </div>
            <div class="field span-2">
              <label for="nombreProcesado">Nombre del procesado</label>
              <input type="text" id="nombreProcesado">
            </div>
            <div class="field">
              <label for="idProcesado">Identificación del procesado</label>
              <input type="text" id="idProcesado">
            </div>
            <div class="field">
              <label for="nitPersonaJuridica">NIT persona jurídica</label>
              <input type="text" id="nitPersonaJuridica">
            </div>
            <div class="field span-2">
              <label for="nombrePersonaJuridica">Nombre persona jurídica</label>
              <input type="text" id="nombrePersonaJuridica">
            </div>
            <div class="field span-2">
              <label for="correo">Correo de contacto</label>
              <input type="email" id="correo">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h3 class="form-section-title">Notas</h3>
          <div class="field-grid">
            <div class="field span-2">
              <label for="observaciones">Observaciones</label>
              <textarea id="observaciones"></textarea>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-ghost">Cancelar</a>
          <button type="submit" class="btn-gold" id="btnGuardar">Guardar audiencia</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const audienciaId = params.get("id");

  async function init() {
    const session = await requireSession();
    if (!session) return;
    wireUserChip(session);

    const [tipos, resultados, abogados] = await Promise.all([
      cargarCatalogo("tipos_audiencia"),
      cargarCatalogo("resultados_audiencia"),
      cargarCatalogo("abogados"),
    ]);
    llenarSelect(document.getElementById("tipoAudiencia"), tipos);
    llenarSelect(document.getElementById("resultado"), resultados);
    llenarSelect(document.getElementById("abogadoTitular"), abogados);
    llenarSelect(document.getElementById("abogadoReemplaza"), abogados);

    wireRadicadoInput(document.getElementById("radicado"), document.getElementById("radicadoHint"));

    if (audienciaId) {
      document.getElementById("formTitle").textContent = "Editar audiencia";
      document.getElementById("formSub").textContent = "Modifica los datos y guarda los cambios.";
      document.getElementById("btnEliminar").innerHTML = ICONOS.papelera + " Eliminar";
      document.getElementById("btnEliminar").style.display = "inline-flex";
      await cargarAudiencia();
    }

    document.getElementById("audienciaForm").addEventListener("submit", guardar);
    document.getElementById("btnEliminar").addEventListener("click", eliminar);
  }

  async function cargarAudiencia() {
    const { data, error } = await db.from("audiencias").select("*").eq("id", audienciaId).single();
    if (error || !data) {
      showToast("No se pudo cargar la audiencia.", true);
      return;
    }
    document.getElementById("radicado").value = data.radicado_proceso || "";
    document.getElementById("radicado").dispatchEvent(new Event("input"));
    document.getElementById("fecha").value = data.fecha || "";
    document.getElementById("hora").value = data.hora ? data.hora.slice(0,5) : "";
    document.getElementById("horaFin").value = data.hora_fin ? data.hora_fin.slice(0,5) : "";
    document.getElementById("modalidad").value = data.modalidad || "Virtual";
    document.getElementById("despacho").value = data.despacho || "";
    document.getElementById("tipoAudiencia").value = data.tipo_audiencia_id || "";
    document.getElementById("resultado").value = data.resultado_audiencia_id || "";
    document.getElementById("abogadoTitular").value = data.abogado_titular_id || "";
    document.getElementById("abogadoReemplaza").value = data.abogado_reemplaza_id || "";
    document.getElementById("nombreProcesado").value = data.nombre_procesado || "";
    document.getElementById("idProcesado").value = data.id_procesado || "";
    document.getElementById("nitPersonaJuridica").value = data.nit_persona_juridica || "";
    document.getElementById("nombrePersonaJuridica").value = data.nombre_persona_juridica || "";
    document.getElementById("cuantia").value = data.cuantia ?? "";
    document.getElementById("linkAudiencia").value = data.link_audiencia || "";
    document.getElementById("correo").value = data.correo || "";
    document.getElementById("observaciones").value = data.observaciones || "";
  }

  function recolectar() {
    return {
      radicado_proceso: document.getElementById("radicado").value,
      fecha: document.getElementById("fecha").value,
      hora: document.getElementById("hora").value || null,
      hora_fin: document.getElementById("horaFin").value || null,
      modalidad: document.getElementById("modalidad").value || "Virtual",
      despacho: document.getElementById("despacho").value || null,
      tipo_audiencia_id: document.getElementById("tipoAudiencia").value || null,
      resultado_audiencia_id: document.getElementById("resultado").value || null,
      abogado_titular_id: document.getElementById("abogadoTitular").value || null,
      abogado_reemplaza_id: document.getElementById("abogadoReemplaza").value || null,
      nombre_procesado: document.getElementById("nombreProcesado").value || null,
      id_procesado: document.getElementById("idProcesado").value || null,
      nit_persona_juridica: document.getElementById("nitPersonaJuridica").value || null,
      nombre_persona_juridica: document.getElementById("nombrePersonaJuridica").value || null,
      cuantia: document.getElementById("cuantia").value === "" ? null : Number(document.getElementById("cuantia").value),
      link_audiencia: document.getElementById("linkAudiencia").value || null,
      correo: document.getElementById("correo").value || null,
      observaciones: document.getElementById("observaciones").value || null,
    };
  }

  async function guardar(e) {
    e.preventDefault();
    const radicadoInput = document.getElementById("radicado");
    if (!radicadoValido(radicadoInput.value)) {
      radicadoInput.classList.add("invalid");
      showToast("El radicado debe tener exactamente 23 dígitos numéricos.", true);
      radicadoInput.focus();
      return;
    }
    radicadoInput.classList.remove("invalid");

    const btn = document.getElementById("btnGuardar");
    btn.disabled = true;
    btn.textContent = "Guardando…";

    const payload = recolectar();
    let error;
    if (audienciaId) {
      ({ error } = await db.from("audiencias").update(payload).eq("id", audienciaId));
    } else {
      ({ error } = await db.from("audiencias").insert(payload));
    }

    btn.disabled = false;
    btn.textContent = "Guardar audiencia";

    if (error) {
      console.error(error);
      if (error.message && error.message.includes("radicado_23_digitos")) {
        showToast("El radicado debe tener exactamente 23 dígitos numéricos.", true);
      } else if (error.code === "23505") {
        showToast("Ya existe una audiencia con ese radicado y esa fecha.", true);
      } else {
        showToast("No se pudo guardar la audiencia.", true);
      }
      return;
    }
    window.location.href = "index.html";
  }

  async function eliminar() {
    const ok = await confirmarAccion("¿Eliminar esta audiencia? Esta acción no se puede deshacer.",
      { titulo: "Eliminar audiencia", textoConfirmar: "Eliminar" });
    if (!ok) return;
    const { error } = await db.from("audiencias").delete().eq("id", audienciaId);
    if (error) {
      showToast("No se pudo eliminar la audiencia.", true);
      return;
    }
    window.location.href = "index.html";
  }

  init();
</script>
</body>
</html>
