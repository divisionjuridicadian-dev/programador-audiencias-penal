<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Programador de Audiencias</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <div class="tab-mark"></div>
      <div class="brand-escudo-wrap"><img src="assets/escudo_colombia.png" alt="DIAN"></div>
      <h1>Programador de Audiencias</h1>
      <div class="subtitle">Unidad Penal · DIAN</div>
    </div>
    <form class="login-body" id="loginForm">
      <div class="login-error" id="loginError"></div>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-gold" id="btnLogin" style="justify-content:center; margin-top:4px;">Ingresar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script>
  (async function(){
    // Si ya hay sesión activa, entra directo.
    const { data: { session } } = await db.auth.getSession();
    if (session) window.location.href = "index.html";
  })();

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const btn = document.getElementById("btnLogin");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Ingresando…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = "Correo o contraseña incorrectos.";
      errorBox.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Ingresar";
      return;
    }
    window.location.href = "index.html";
  });
</script>
</body>
</html>
